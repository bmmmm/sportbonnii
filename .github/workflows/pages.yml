name: pages

# Fetch every club calendar, gate the result, publish site/ to GitHub Pages.
# Nothing is committed: the data lives only in the deployed artifact, and the
# last good state is read back from the live site (PREVIOUS_STATE_URL), so a
# failing source keeps its previous events instead of vanishing.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Full fetch: ignore the stored validators, read every source again'
        type: boolean
        default: false

permissions: {}

# Never abort a running deployment: a cancelled deploy-pages can leave the
# site in a failed state until the next run finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Runs repo code and fetches foreign feeds, so it gets read access only;
    # the deploy job alone holds the Pages/OIDC rights.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Fetch club calendars
        env:
          PREVIOUS_STATE_URL: https://bmmmm.github.io/sportbonnii/data/
          # The commit producing this data: a scheduled run on the same commit
          # may ask the sources conditionally and keep what answered 304.
          # A manual run with "full" drops the build id, so every source is
          # read again (and the next scheduled run, seeing no build, too).
          BUILD_ID: ${{ github.sha }}
          FULL_FETCH: ${{ inputs.full }}
        run: |
          if [ "$FULL_FETCH" = "true" ]; then unset BUILD_ID; fi
          pnpm run fetch >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm run smoke
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
